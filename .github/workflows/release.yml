name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (locked)
        run: uv sync --frozen --python 3.12

      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          uv run --no-sync --with pyinstaller pyinstaller --noconfirm --clean --onedir --windowed
          --name KeePassLANShare --collect-all zeroconf --collect-all keyring app.py

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist/KeePassLANShare/* -DestinationPath KeePassLANShare-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassLANShare-portable
          path: KeePassLANShare-portable.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" KeePassLANShare-portable.zip --title "${{ github.ref_name }}" --generate-notes
