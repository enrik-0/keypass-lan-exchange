name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies (locked)
        run: uv sync --frozen --python 3.12

      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          uv run --no-sync --with pyinstaller pyinstaller --noconfirm --clean --onedir --windowed
          --name KeePassLANShare --collect-all zeroconf --collect-all keyring app.py

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/KeePassLANShare/* -DestinationPath KeePassLANShare-portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KeePassLANShare-release
          path: |
            installer-output/KeePassLANShare-Setup.exe
            KeePassLANShare-portable.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer-output/KeePassLANShare-Setup.exe KeePassLANShare-portable.zip --title "${{ github.ref_name }}" --generate-notes
